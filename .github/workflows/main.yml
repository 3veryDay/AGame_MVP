# workflow의 이름
name: Deploy to Amazon EC2 / Spring Boot with Maven
on:
  push:
    branches:
      - main  # 또는 배포에 쓸 브랜치 이름

      
# 환경 변수 $변수명으로 사용
env:
  PROJECT_NAME: AGame_MVP
  BUCKET_NAME: agame-bucket
  CODE_DEPLOY_APP: agame-codedeploy-app
  CODE_DEPLOY_DEPLOYMENT_GROUP: Agame-codedeploy-deployment-group


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Zip deployment package
        run: |
          zip -r $PROJECT_NAME.zip MVP_AGame_SPRING Dockerfile appspec.yml deploy.sh

      - name: Upload to S3
        run: |
          aws s3 cp $PROJECT_NAME.zip s3://$BUCKET_NAME/deploy/$PROJECT_NAME.zip \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Trigger CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name $CODE_DEPLOY_APP \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name $CODE_DEPLOY_DEPLOYMENT_GROUP \
            --s3-location bucket=$BUCKET_NAME,bundleType=zip,key=deploy/$PROJECT_NAME.zip \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
