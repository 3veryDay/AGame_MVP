name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Upload and Trigger CodeDeploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Dynamic Bundle Name
        run: echo "BUNDLE_NAME=AGame_MVP-${{ github.sha }}.zip" >> $GITHUB_ENV

      - name: Zip Deployment Package
        run: |
          zip -r ${{ env.BUNDLE_NAME }} MVP_Final deploy.sh appspec.yml Dockerfile

      - name: Upload to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl private --follow-symlinks
        env:
          AWS_S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
          SOURCE_DIR: .
          DEST_DIR: /AGame_MVP

      - name: Trigger CodeDeploy
        uses: webfactory/create-aws-codedeploy-deployment@v0.2.0
        with:
          application-name: ${{ secrets.DEPLOY_APP }}
          deployment-group: ${{ secrets.DEPLOY_GROUP }}
          bucket: ${{ secrets.S3_BUCKET }}
          bundle-key: ${{ env.BUNDLE_NAME }}
          bundle-type: zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
