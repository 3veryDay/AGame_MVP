version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/MVP_Final
    overwrite: yes

permissions:
  - object: /home/ubuntu/MVP_Final
    pattern: "**"
    owner: ubuntu
    group: ubuntu

hooks:
  AfterInstall:
    - location: MVP_Final/deploy.sh
      timeout: 500
      runas: root
